<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Import Member DRW Prime</title>
<style>
body{font-family:Arial;max-width:700px;margin:40px auto;padding:20px}
h2{color:#087f5b}
input,button{padding:10px 16px;margin:8px 0;font-size:14px}
button{background:#087f5b;color:#fff;border:none;border-radius:6px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#log{background:#f4f4f4;padding:12px;border-radius:6px;max-height:500px;overflow-y:auto;font:13px monospace;white-space:pre-wrap;margin-top:16px}
#progress{height:24px;background:#e0e0e0;border-radius:12px;overflow:hidden;margin:12px 0}
#bar{height:100%;background:#087f5b;width:0;transition:width .3s}
.stats{display:flex;gap:20px;margin-top:12px}
.stat{padding:12px 20px;border-radius:8px;font-weight:bold;font-size:16px}
.stat.created{background:#d3f9d8;color:#2b8a3e}
.stat.skipped{background:#fff3bf;color:#e67700}
.stat.error{background:#ffe3e3;color:#c92a2a}
</style>
</head>
<body>

<h2>Import Member CSV → DRW Prime</h2>
<p>Pilih file CSV (kolom: <code>Phone,First Name,Last Name</code>), lalu klik Import. Bisa dijalankan ulang — member yang sudah ada otomatis dilewati.</p>

<input type="file" id="fileInput" accept=".csv">
<div style="margin-top:8px">
  <label>Chunk size: <input type="number" id="chunkSize" value="100" min="10" max="500" style="width:70px"></label>
  <button id="startBtn" disabled>Import</button>
</div>

<div id="progress"><div id="bar"></div></div>

<div class="stats">
  <div class="stat created" id="statCreated">0 Baru</div>
  <div class="stat skipped" id="statSkipped">0 Skip</div>
  <div class="stat error" id="statError">0 Error</div>
</div>

<div id="log">Menunggu file...</div>

<script>
const fileInput = document.getElementById('fileInput');
const startBtn = document.getElementById('startBtn');
const logEl = document.getElementById('log');
const bar = document.getElementById('bar');

let csvLines = [];

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const text = await file.text();
  csvLines = text.split(/\r?\n/).filter(l => l.trim());
  if (csvLines.length < 2) { log('File minimal harus punya header + 1 baris data'); return; }
  log(`File OK: ${csvLines.length - 1} baris data siap diimport.`);
  startBtn.disabled = false;
};

startBtn.onclick = async () => {
  if (csvLines.length < 2) return;
  startBtn.disabled = true;
  const chunkSize = parseInt(document.getElementById('chunkSize').value) || 100;
  const header = csvLines[0];
  const data = csvLines.slice(1);
  const chunks = [];

  for (let i = 0; i < data.length; i += chunkSize) {
    chunks.push([header, ...data.slice(i, i + chunkSize)].join('\n'));
  }

  let created = 0, skipped = 0, errors = 0;
  log(`Mulai import ${data.length} baris dalam ${chunks.length} chunk...`);

  for (let i = 0; i < chunks.length; i++) {
    const fd = new FormData();
    fd.append('file', new Blob([chunks[i]], {type:'text/csv'}), `chunk_${i+1}.csv`);

    try {
      const res = await fetch('/api/front-office/members/bulk-import', {method:'POST', body:fd});
      const json = await res.json();

      if (json.error) {
        log(`Chunk ${i+1}/${chunks.length}: ERROR - ${json.error}`);
        errors += chunkSize;
      } else {
        const s = json.summary;
        created += s.created || 0;
        skipped += (s.skippedDuplicateInFile||0) + (s.skippedAlreadyExists||0);
        errors += s.errors || 0;
        log(`Chunk ${i+1}/${chunks.length}: ${s.created||0} baru, ${(s.skippedDuplicateInFile||0)+(s.skippedAlreadyExists||0)} skip, ${s.errors||0} error`);
      }

      bar.style.width = ((i+1)/chunks.length*100) + '%';
      document.getElementById('statCreated').textContent = created + ' Baru';
      document.getElementById('statSkipped').textContent = skipped + ' Skip';
      document.getElementById('statError').textContent = errors + ' Error';
    } catch (e) {
      log(`Chunk ${i+1}/${chunks.length}: NETWORK ERROR - ${e.message}`);
      errors += chunkSize;
    }
  }

  log(`\nSELESAI: ${created} baru, ${skipped} sudah ada/dilewati, ${errors} error`);
  startBtn.disabled = false;
};

function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}
</script>
</body>
</html>
