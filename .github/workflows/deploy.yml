name: Deploy to VPS (manual)

on:
  workflow_dispatch:

concurrency:
  group: drwprime-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DEPLOY_IMAGE: ghcr.io/mkwcorp88/drwprime
  REGISTRY_HOST_PORT: 127.0.0.1:5555

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    name: Build & push
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.DEPLOY_IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DEPLOY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DEPLOY_IMAGE }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsuZHJ3cHJpbWUuY29tJA
            RELEASE_SHA=${{ github.sha }}
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
            database_uri=${{ secrets.DATABASE_URI }}
            payload_secret=${{ secrets.PAYLOAD_SECRET }}
            clerk_secret_key=${{ secrets.CLERK_SECRET_KEY }}

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Mirror to local registry
        run: |
          set -euo pipefail
          printf '%s' "${{ github.token }}" | docker login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          docker pull "$DEPLOY_IMAGE:$IMAGE_TAG"
          docker tag "$DEPLOY_IMAGE:$IMAGE_TAG" "$REGISTRY_HOST_PORT/drwprime:$IMAGE_TAG"
          docker push "$REGISTRY_HOST_PORT/drwprime:$IMAGE_TAG"

      - name: Migrate and deploy with rollback
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-standalone.sh \
            "$REGISTRY_HOST_PORT/drwprime:$IMAGE_TAG" \
            "$IMAGE_TAG"
